name: python-quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: python-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install shellcheck / shfmt
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: uv sync
        run: uv sync --locked --dev

      - name: npm install (pi/)
        working-directory: pi
        run: npm install

      - name: npm install (opencode/)
        working-directory: opencode
        run: npm install

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest

  # 3.12 stays a tested, supported floor (requires-python >=3.12) until the
  # work machine's Python is known. .python-version pins 3.14, so every uv
  # call here passes --python 3.12 explicitly and a step asserts the venv
  # really is 3.12 — otherwise this job could silently rerun 3.14.
  # UV_PYTHON covers the uv calls tests make themselves (test_lint.py runs
  # a bare `uv run ruff`): without it, those resync the venv to 3.14
  # mid-run.
  test-3-12:
    name: python-quality-3-12
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install shellcheck / shfmt
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: uv sync
        run: uv sync --locked --dev --python 3.12

      - name: assert the venv is 3.12
        run: uv run --python 3.12 python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: npm install (pi/)
        working-directory: pi
        run: npm install

      - name: npm install (opencode/)
        working-directory: opencode
        run: npm install

      - name: pytest
        run: uv run --python 3.12 pytest
