# links.toml — the agent-toolkit symlink table read by install.py.
# Managed harness targets across macOS, Linux, and WSL.

# ── shell helpers ────────────────────────────────────────────────────────

[[link]]
src = "shell/agent-tools.zsh"
dest = "~/.agent-tools.zsh"

# ── Claude Code wiring ───────────────────────────────────────────────────

# All 4 entries below (and the copilot/agy/pi ones further down) source
# CORE_INSTRUCTIONS.md, not global-instructions.md -- dotfiles' own links.toml
# sources global-instructions.md instead (the composed core+personal file).
# This is intentional, permanent divergence, not something to revert to
# match dotfiles: agent-toolkit never had global-instructions.md at all
# after this split.
